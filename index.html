<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <div id="success-message" class="success-message">
        <i class="fas fa-check-circle"></i>
        تم إرسال طلبك بنجاح!
    </div>

    <form action="">
        <h1>Web Developer Application abood alsheir </h1>

        <div>
            <label for="name">Full Name</label>
            <input id="name" type="text" placeholder="NAME >
        </div>

        <div>
            <label for=" email">Email</label>
            <input id="email" type="email" placeholder="you@example.com">
        </div>
        <div>
            <label for="skills">Key Skills</label>
            <input id="skills" type="text" placeholder="HTML, CSS, JavaScript, React...">
        </div>

        <div>
            <label for="experience">Years of Experience</label>
            <input id="experience" type="number" min="0" placeholder="e.g. 2,3,5...">
        </div>

        <div>
            <label for="message">Why are you a good fit?</label>
            <textarea id="message" rows="4" placeholder="Tell us about your experience and goals"></textarea>
        </div>

        <button type="submit">Submit Application</button>
    </form>

    <div id="thank-you-page" class="thank-you-page">
        <div class="thank-you-box">
            <i class="fas fa-check-circle"></i>
            <h2>شكراً على تقديم الطلب</h2>
            <p>مع تحياتي المهندس عبدالله أحمد الشاعر</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
