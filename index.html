<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <form action="">
        <h1>Web Developer Application ABOOD ALSAHIER</h1>

        <div>
            <label for="name">Full Name</label>
            <input id="name" type="text" placeholder="Your full name" required>
        </div>

        <div>
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" required>
        </div>

        <div>
            <label for="skills">Key Skills</label>
            <input id="skills" type="text" placeholder="HTML, CSS, JavaScript, React..." required>
        </div>

        <div>
            <label for="experience">Years of Experience</label>
            <input id="experience" type="number" min="0" placeholder="e.g. 2" required>
        </div>

        <div>
            <label for="message">Why are you a good fit?</label>
            <textarea id="message" rows="4" placeholder="Tell us about your experience and goals" required></textarea>
        </div>

        <button type="submit">Submit Application</button>
    </form>

    <script src="js/script.js"></script>
</body>

</html>
